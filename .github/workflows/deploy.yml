# Builds the static export and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# The deploy job needs to write to Pages and prove its identity (OIDC) to do so.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels nothing mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # We set basePath in next.config.ts ourselves, so we don't pass
      # `static_site_generator: next` here (it would try to rewrite the config).
      - uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build # output: "export" writes the site to out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
